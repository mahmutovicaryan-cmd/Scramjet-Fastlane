<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Fastlane Browser</title>

		<link rel="shortcut icon" content="favicon.webp" />

		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>

		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<header class="browser-top">
			<div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
			<button id="nav-back" class="nav-btn" type="button" title="Back">‹</button>
			<button id="nav-home" class="nav-btn" type="button" title="Home">⌂</button>
			<form id="sj-form" class="address-form">
				<input
					id="sj-search-engine"
					value="https://www.bing.com/search?q=%s"
					type="hidden"
				/>
				<input id="sj-address" type="text" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false" />
				<button id="go-btn" type="submit">Go</button>
			</form>
		</header>

		<main id="home-screen" class="home-screen">
			<div class="home-card">
				<img src="https://i.postimg.cc/Rqzx7WDd/Fastlane-7-removebg-preview.png" alt="" />
				<h1>Fastlane Browser</h1>
				<p>Search the web or open a direct URL.</p>
				<div class="quick-row">
					<button type="button" data-query="youtube.com">YouTube</button>
					<button type="button" data-query="google.com">Google</button>
					<button type="button" data-query="wikipedia.org">Wikipedia</button>
				</div>
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</div>
		</main>
	</body>
</html>
