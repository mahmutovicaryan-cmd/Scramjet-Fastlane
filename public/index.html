<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Fastlane Browser</title>

		<link rel="shortcut icon" content="favicon.webp" />

		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="index.js?v=browser-stable-4" defer></script>
	</head>

	<body>
		<div class="app-bg" aria-hidden="true"></div>
		<header class="browser-top">
			<div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
			<button id="nav-back" class="nav-btn icon" type="button" title="Back">&lsaquo;</button>
			<button id="nav-home" class="nav-btn" type="button" title="Home">Home</button>
			<form id="sj-form" class="address-form">
				<input
					id="sj-search-engine"
					value="https://www.google.com/search?q=%s"
					type="hidden"
				/>
				<input id="sj-address" type="text" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false" />
				<button id="go-btn" type="submit">Go</button>
			</form>
		</header>

		<main id="home-screen" class="home-screen">
			<div class="home-card">
				<div class="logo-mark">
					<img src="https://i.postimg.cc/Rqzx7WDd/Fastlane-7-removebg-preview.png" alt="" />
					<span class="logo-fallback" aria-hidden="true">FL</span>
				</div>
				<h1>Fastlane Browser</h1>
				<p>Search the web or open a direct URL.</p>
				<div class="quick-row">
					<button type="button" data-query="youtube.com">YouTube</button>
					<button type="button" data-query="google.com">Google</button>
					<button type="button" data-query="wikipedia.org">Wikipedia</button>
				</div>
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</div>
		</main>

		<div id="loading-layer" class="loading-layer" aria-live="polite">
			<div class="loading-card">
				<div class="loader"></div>
				<div>
					<div id="loading-title" class="loading-title">Opening page</div>
					<div id="loading-sub" class="loading-sub">Preparing Fastlane Browser</div>
				</div>
			</div>
		</div>

		<button id="debug-toggle" type="button" title="Browser diagnostics">i</button>
		<section id="debug-panel" aria-label="Browser diagnostics">
			<div class="debug-head">
				<strong>Browser Diagnostics</strong>
				<div>
					<button id="debug-copy" type="button">Copy</button>
					<button id="debug-reset" type="button">Repair</button>
					<button id="debug-close" type="button">Close</button>
				</div>
			</div>
			<pre id="debug-log"></pre>
		</section>
	</body>
</html>
